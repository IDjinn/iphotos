services:
  # pgvector build of Postgres 17 (doc 18, D22): drop-in replacement for
  # postgres:17-alpine — same data volume, adds the `vector` extension used by
  # face embeddings (and future semantic search).
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: iphotos
      POSTGRES_PASSWORD: iphotos
      POSTGRES_DB: iphotos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iphotos -d iphotos"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Loopback-only: psql access is local-dev only; nothing on the LAN.
    ports:
      - "127.0.0.1:5432:5432"

  # Standalone blob/object storage (filesystem, S3/Wasabi/MinIO, WebDAV, Google Drive).
  # The api and worker talk to it over HTTP; no shared volume is needed when
  # BlobStorage__Mode=Http. With the default filesystem provider the objects live in
  # the storage-data volume below.
  storage:
    image: iphotos.storage
    build:
      context: .
      dockerfile: iPhotos.Storage.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__ApiKey: ${IPHOTOS_STORAGE_API_KEY:-change-me-storage-api-key}
      Storage__SigningKey: ${IPHOTOS_STORAGE_SIGNING_KEY:-change-me-in-production-32-bytes-minimum!!}
      Storage__AllowPrivateNetworks: "true" # compose-internal endpoints (api -> storage, filesystem provider)
      Storage__DefaultProvider: ${IPHOTOS_STORAGE_PROVIDER:-filesystem}
      # Zip-import staging PUTs stream the whole archive through the storage host,
      # so its body cap must stay above ZipImport:MaxZipBytes (100 GiB).
      Storage__MaxBodyBytes: "118111600640"
      Providers__FileSystem__RootPath: /var/lib/iphotos/objects
      # S3-compatible blob target (Wasabi/MinIO/B2/R2/AWS) — values come from backend/.env.
      # Flip IPHOTOS_STORAGE_PROVIDER=s3 there (and fill the IPHOTOS_S3_* vars) to switch.
      Providers__S3__Endpoint: ${IPHOTOS_S3_ENDPOINT:-}
      Providers__S3__Region: ${IPHOTOS_S3_REGION:-us-east-1}
      Providers__S3__Bucket: ${IPHOTOS_S3_BUCKET:-}
      Providers__S3__AccessKey: ${IPHOTOS_S3_ACCESS_KEY:-}
      Providers__S3__SecretKey: ${IPHOTOS_S3_SECRET_KEY:-}
      Providers__S3__ForcePathStyle: ${IPHOTOS_S3_FORCE_PATH_STYLE:-true} # true for Wasabi/MinIO/B2/R2; false for AWS proper
      Providers__S3__Prefix: ${IPHOTOS_S3_PREFIX:-}
      # Transfer throughput knobs: parallel parts per upload, part size, retries
      # and the wall-clock budget for single-shot PUTs.
      Providers__S3__ConcurrentServiceRequests: ${IPHOTOS_S3_CONCURRENT_REQUESTS:-8}
      Providers__S3__PartSizeBytes: ${IPHOTOS_S3_PART_SIZE_BYTES:-33554432}
      Providers__S3__MaxErrorRetry: ${IPHOTOS_S3_MAX_ERROR_RETRY:-3}
      Providers__S3__SinglePutTimeoutMinutes: ${IPHOTOS_S3_SINGLE_PUT_TIMEOUT_MINUTES:-30}
    volumes:
      - storage-data:/var/lib/iphotos/objects
    # Loopback-only: the storage service is an internal dependency of api/worker.
    ports:
      - "127.0.0.1:5206:8080"

  api:
    image: iphotos.api
    build:
      context: .
      dockerfile: iPhotos.Core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=iphotos;Username=iphotos;Password=iphotos
      BlobStorage__Mode: Http
      StorageService__BaseUrl: http://storage:8080
      StorageService__ApiKey: ${IPHOTOS_STORAGE_API_KEY:-change-me-storage-api-key}
      StorageService__AllowPrivateNetworks: "true"
      # Zip staging (raw archives) goes to the storage host's filesystem provider
      # (storage-data volume, docker-local disk) so multi-GB uploads never
      # round-trip through S3; only processed photos land in S3.
      StorageService__StagingProvider: ${IPHOTOS_STORAGE_STAGING_PROVIDER:-filesystem}
      Auth__Jwt__SigningKey: ${IPHOTOS_JWT_SIGNING_KEY:-change-me-in-production-32-bytes-minimum!!}
      # Browser origins allowed to call the API (web app dev server, desktop shell).
      # Next dev serves on both loopback hosts; the Origin header must match exactly.
      Cors__AllowedOrigins__0: ${IPHOTOS_CORS_ORIGIN_WEB:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${IPHOTOS_CORS_ORIGIN_WEB_127:-http://127.0.0.1:3000}
      Cors__AllowedOrigins__2: ${IPHOTOS_CORS_ORIGIN_DESKTOP:-http://127.0.0.1:3210}
      # Per-file upload caps in bytes per (plan × upload quality): "original" modes
      # reject oversize files; "saver" modes compress/transcode them to fit in the worker.
      Upload__FreeSaverMaxImageBytes: ${IPHOTOS_UPLOAD__FREE_SAVER_MAX_IMAGE_BYTES:-16777216}
      Upload__FreeSaverMaxVideoBytes: ${IPHOTOS_UPLOAD__FREE_SAVER_MAX_VIDEO_BYTES:-1073741824}
      Upload__PaidSaverMaxImageBytes: ${IPHOTOS_UPLOAD__PAID_SAVER_MAX_IMAGE_BYTES:-262144000}
      Upload__PaidSaverMaxVideoBytes: ${IPHOTOS_UPLOAD__PAID_SAVER_MAX_VIDEO_BYTES:-10737418240}
      Upload__FreeOriginalMaxImageBytes: ${IPHOTOS_UPLOAD__FREE_ORIGINAL_MAX_IMAGE_BYTES:-67108864}
      Upload__FreeOriginalMaxVideoBytes: ${IPHOTOS_UPLOAD__FREE_ORIGINAL_MAX_VIDEO_BYTES:-1073741824}
      Upload__PaidOriginalMaxImageBytes: ${IPHOTOS_UPLOAD__PAID_ORIGINAL_MAX_IMAGE_BYTES:-524288000}
      Upload__PaidOriginalMaxVideoBytes: ${IPHOTOS_UPLOAD__PAID_ORIGINAL_MAX_VIDEO_BYTES:-32212254720}
      Upload__SaverVideoMaxHeight: ${IPHOTOS_UPLOAD__SAVER_VIDEO_MAX_HEIGHT:-1080}
      # Presigned PUT expiries scale with the file size at this assumed throughput.
      Upload__AssumedUploadMbps: ${IPHOTOS_UPLOAD__ASSUMED_MBPS:-20}
      Upload__UploadUrlMaxExpiryHours: ${IPHOTOS_UPLOAD__MAX_URL_EXPIRY_HOURS:-24}
      # Direct uploads at or above this size use presigned multipart (S3 caps one PUT at 5 GB).
      Upload__DirectMultipartThresholdBytes: ${IPHOTOS_UPLOAD__MULTIPART_THRESHOLD_BYTES:-5368709120}
      # AI pipelines (doc 18): face service + scene-label vision endpoint.
      Ai__Enabled: ${IPHOTOS_AI_ENABLED:-true}
      # Point at the in-compose CPU service by default; set IPHOTOS_ML_BASE_URL
      # (e.g. http://host.docker.internal:5207) to use a GPU-backed host service.
      Ml__BaseUrl: ${IPHOTOS_ML_BASE_URL:-http://ml:8080}
      Ml__ApiKey: ${IPHOTOS_ML_API_KEY:-change-me-ml-api-key}
      Vision__BaseUrl: ${IPHOTOS_VISION_BASE_URL:-}
      Vision__ApiKey: ${IPHOTOS_VISION_API_KEY:-}
      Vision__Model: ${IPHOTOS_VISION_MODEL:-}
      # ML input staging (doc 18 §6.2): direct uploads generate the preview/thumbnail
      # here; the worker consumes the staged bytes for faces/labels instead of
      # re-downloading the blobs from S3. Shared volume with the worker below.
      Ml__InputCacheDir: /var/lib/iphotos/ml-inputs
    volumes:
      - ml-inputs:/var/lib/iphotos/ml-inputs
    # Reachable on the LAN (large zip imports bypass the Cloudflare 100 MB body
    # cap via the LAN address); remote traffic keeps flowing through the
    # cloudflared tunnel below (TLS via Cloudflare edge).
    ports:
      - "5205:8080"

  worker:
    image: iphotos.worker
    build:
      context: .
      dockerfile: iPhotos.Worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=iphotos;Username=iphotos;Password=iphotos
      BlobStorage__Mode: Http
      StorageService__BaseUrl: http://storage:8080
      StorageService__ApiKey: ${IPHOTOS_STORAGE_API_KEY:-change-me-storage-api-key}
      StorageService__AllowPrivateNetworks: "true"
      # Same staging provider as the api: the worker reads (and deletes) raw zip
      # archives from the storage host's filesystem provider, never from S3.
      StorageService__StagingProvider: ${IPHOTOS_STORAGE_STAGING_PROVIDER:-filesystem}
      # The worker applies the storage-saver caps (§3.5), so it needs the same
      # Upload matrix as the api — keep these in sync.
      Upload__FreeSaverMaxImageBytes: ${IPHOTOS_UPLOAD__FREE_SAVER_MAX_IMAGE_BYTES:-16777216}
      Upload__FreeSaverMaxVideoBytes: ${IPHOTOS_UPLOAD__FREE_SAVER_MAX_VIDEO_BYTES:-1073741824}
      Upload__PaidSaverMaxImageBytes: ${IPHOTOS_UPLOAD__PAID_SAVER_MAX_IMAGE_BYTES:-262144000}
      Upload__PaidSaverMaxVideoBytes: ${IPHOTOS_UPLOAD__PAID_SAVER_MAX_VIDEO_BYTES:-10737418240}
      Upload__FreeOriginalMaxImageBytes: ${IPHOTOS_UPLOAD__FREE_ORIGINAL_MAX_IMAGE_BYTES:-67108864}
      Upload__FreeOriginalMaxVideoBytes: ${IPHOTOS_UPLOAD__FREE_ORIGINAL_MAX_VIDEO_BYTES:-1073741824}
      Upload__PaidOriginalMaxImageBytes: ${IPHOTOS_UPLOAD__PAID_ORIGINAL_MAX_IMAGE_BYTES:-524288000}
      Upload__PaidOriginalMaxVideoBytes: ${IPHOTOS_UPLOAD__PAID_ORIGINAL_MAX_VIDEO_BYTES:-32212254720}
      Upload__SaverVideoMaxHeight: ${IPHOTOS_UPLOAD__SAVER_VIDEO_MAX_HEIGHT:-1080}
      Worker__PollIntervalSeconds: "0.5"
      # Fast lanes (photos, cheap) + slow lanes (videos, ffmpeg) processing in
      # parallel; per-job wall-clock budgets prevent a hung job from pinning a lane.
      Worker__PhotoLaneConcurrency: ${IPHOTOS_WORKER__PHOTO_LANES:-8}
      Worker__VideoLaneConcurrency: ${IPHOTOS_WORKER__VIDEO_LANES:-2}
      Worker__PhotoJobTimeoutMinutes: ${IPHOTOS_WORKER__PHOTO_JOB_TIMEOUT_MINUTES:-10}
      Worker__VideoJobTimeoutMinutes: ${IPHOTOS_WORKER__VIDEO_JOB_TIMEOUT_MINUTES:-60}
      # AI pipelines (doc 18): face jobs, clustering and scene labels.
      Ai__Enabled: ${IPHOTOS_AI_ENABLED:-true}
      # Library backfill stays OFF by default: it would re-download every existing
      # photo's preview from S3. Flip IPHOTOS_AI_BACKFILL_ENABLED=true to index
      # the pre-existing library.
      Ai__BackfillEnabled: ${IPHOTOS_AI_BACKFILL_ENABLED:-false}
      Ml__BaseUrl: ${IPHOTOS_ML_BASE_URL:-http://ml:8080}
      Ml__ApiKey: ${IPHOTOS_ML_API_KEY:-change-me-ml-api-key}
      Vision__BaseUrl: ${IPHOTOS_VISION_BASE_URL:-}
      Vision__ApiKey: ${IPHOTOS_VISION_API_KEY:-}
      Vision__Model: ${IPHOTOS_VISION_MODEL:-}
      Worker__MlFaceLaneConcurrency: ${IPHOTOS_WORKER__ML_FACE_LANES:-2}
      Worker__MlLabelLaneConcurrency: ${IPHOTOS_WORKER__ML_LABEL_LANES:-1}
      Worker__MlBackfillIntervalHours: ${IPHOTOS_WORKER__ML_BACKFILL_HOURS:-6}
      # Same staging directory as the api (shared ml-inputs volume): faces/labels
      # jobs read the preview/thumbnail the api/variant pipeline just generated,
      # so the ML stage does no blob downloads on the happy path.
      Ml__InputCacheDir: /var/lib/iphotos/ml-inputs
    volumes:
      - ml-inputs:/var/lib/iphotos/ml-inputs

  # Face detection + embeddings (doc 18 §4): insightface buffalo_l baked in,
  # stateless, internal-only. Unset IPHOTOS_AI_ENABLED=false to disable the
  # whole AI pipeline without rebuilding.
  ml:
    image: iphotos.ml
    build:
      context: ../ml
      dockerfile: Dockerfile
    environment:
      ML_API_KEY: ${IPHOTOS_ML_API_KEY:-change-me-ml-api-key}
      ML_EXECUTION_PROVIDER: ${IPHOTOS_ML_EXECUTION_PROVIDER:-auto}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    # Loopback-only debug port; api/worker reach it over the compose network.
    ports:
      - "127.0.0.1:5207:8080"

  # Named Cloudflare tunnel: stable public hostname api.lucas-romero.com -> api:8080.
  # Ingress rules live in ./cloudflared/config.yml; the tunnel credentials JSON stays
  # on the host (never committed) — set IPHOTOS_CLOUDFLARED_CREDENTIALS in backend/.env.
  # To recreate credentials: cloudflared tunnel login && cloudflared tunnel create iphotos,
  # then cloudflared tunnel route dns iphotos api.lucas-romero.com.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${IPHOTOS_CLOUDFLARED_CREDENTIALS}:/etc/cloudflared/credentials.json:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  storage-data:
  ml-inputs:
