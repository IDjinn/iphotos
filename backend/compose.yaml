services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iphotos
      POSTGRES_PASSWORD: iphotos
      POSTGRES_DB: iphotos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iphotos -d iphotos"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Loopback-only: psql access is local-dev only; nothing on the LAN.
    ports:
      - "127.0.0.1:5432:5432"

  # Standalone blob/object storage (filesystem, S3/Wasabi/MinIO, WebDAV, Google Drive).
  # The api and worker talk to it over HTTP; no shared volume is needed when
  # BlobStorage__Mode=Http. With the default filesystem provider the objects live in
  # the storage-data volume below.
  storage:
    image: iphotos.storage
    build:
      context: .
      dockerfile: iPhotos.Storage.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__ApiKey: ${IPHOTOS_STORAGE_API_KEY:-change-me-storage-api-key}
      Storage__SigningKey: ${IPHOTOS_STORAGE_SIGNING_KEY:-change-me-in-production-32-bytes-minimum!!}
      Storage__AllowPrivateNetworks: "true" # compose-internal endpoints (api -> storage, filesystem provider)
      Storage__DefaultProvider: ${IPHOTOS_STORAGE_PROVIDER:-filesystem}
      Providers__FileSystem__RootPath: /var/lib/iphotos/objects
      # S3-compatible blob target (Wasabi/MinIO/B2/R2/AWS) — values come from backend/.env.
      # Flip IPHOTOS_STORAGE_PROVIDER=s3 there (and fill the IPHOTOS_S3_* vars) to switch.
      Providers__S3__Endpoint: ${IPHOTOS_S3_ENDPOINT:-}
      Providers__S3__Region: ${IPHOTOS_S3_REGION:-us-east-1}
      Providers__S3__Bucket: ${IPHOTOS_S3_BUCKET:-}
      Providers__S3__AccessKey: ${IPHOTOS_S3_ACCESS_KEY:-}
      Providers__S3__SecretKey: ${IPHOTOS_S3_SECRET_KEY:-}
      Providers__S3__ForcePathStyle: ${IPHOTOS_S3_FORCE_PATH_STYLE:-true} # true for Wasabi/MinIO/B2/R2; false for AWS proper
      Providers__S3__Prefix: ${IPHOTOS_S3_PREFIX:-}
    volumes:
      - storage-data:/var/lib/iphotos/objects
    # Loopback-only: the storage service is an internal dependency of api/worker.
    ports:
      - "127.0.0.1:5206:8080"

  api:
    image: iphotos.api
    build:
      context: .
      dockerfile: iPhotos.Core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=iphotos;Username=iphotos;Password=iphotos
      BlobStorage__Mode: Http
      StorageService__BaseUrl: http://storage:8080
      StorageService__ApiKey: ${IPHOTOS_STORAGE_API_KEY:-change-me-storage-api-key}
      StorageService__AllowPrivateNetworks: "true"
      Auth__Jwt__SigningKey: ${IPHOTOS_JWT_SIGNING_KEY:-change-me-in-production-32-bytes-minimum!!}
    # No volume: blobs live in the storage service.
    # Loopback-only: the backend is reachable from outside exclusively through
    # the cloudflared tunnel below (TLS via Cloudflare edge). LAN clients and
    # the host network can no longer hit the API directly on port 5205.
    ports:
      - "127.0.0.1:5205:8080"

  worker:
    image: iphotos.worker
    build:
      context: .
      dockerfile: iPhotos.Worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=iphotos;Username=iphotos;Password=iphotos
      BlobStorage__Mode: Http
      StorageService__BaseUrl: http://storage:8080
      StorageService__ApiKey: ${IPHOTOS_STORAGE_API_KEY:-change-me-storage-api-key}
      StorageService__AllowPrivateNetworks: "true"
      Worker__PollIntervalSeconds: "0.5"
    # No volume: blobs live in the storage service.

  # Named Cloudflare tunnel: stable public hostname api.lucas-romero.com -> api:8080.
  # Ingress rules live in ./cloudflared/config.yml; the tunnel credentials JSON stays
  # on the host (never committed) — set IPHOTOS_CLOUDFLARED_CREDENTIALS in backend/.env.
  # To recreate credentials: cloudflared tunnel login && cloudflared tunnel create iphotos,
  # then cloudflared tunnel route dns iphotos api.lucas-romero.com.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${IPHOTOS_CLOUDFLARED_CREDENTIALS}:/etc/cloudflared/credentials.json:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  storage-data:
