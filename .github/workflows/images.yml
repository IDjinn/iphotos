name: images

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/idjinn/iphotos
  NEXT_PUBLIC_API_URL: https://iphotos.lucas-romero.com

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: storage
            context: backend
            file: backend/iPhotos.Storage.Host/Dockerfile
            cache_scope: storage
            build_args: ""
          - image: api
            context: backend
            file: backend/iPhotos.Core/Dockerfile
            cache_scope: api
            build_args: ""
          - image: worker
            context: backend
            file: backend/iPhotos.Worker/Dockerfile
            cache_scope: worker
            build_args: ""
          - image: web
            context: web
            file: web/Dockerfile
            cache_scope: web
            build_args: |
              NEXT_PUBLIC_API_URL=https://iphotos.lucas-romero.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max
